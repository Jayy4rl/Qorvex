[workspace]
resolver = "2"
members = ["qorvex-guard", "demo-ledger", "demo-token", "guardian"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Jayy4rl/Qorvex"

[workspace.dependencies]
near-sdk = "5.29"
near-contract-standards = "5.29"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
